<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./script.js"></script>
    <title>Login</title>
</head>
<body>
    <main>
        <h1>Welcome to the web!</h1>
        <p>Please login to continue</p>
        <section>
            <!-- Login form -->
            <form action="submit">
                
                <label for="loginUserInput">
                    Username:
                    <input id="loginUserInput" type="text" name="name">
                </label>
                
                <label for="logPassInput">
                    Password:
                    <input id="logPassInput" type="text" name="password">
                </label>
                <button type="submit">Log in</button>
            </form>
            
            <section>
                <p>Not already a user?</p>
                <button>Register new user</button>
            </section>
        </section>

        <!-- Register form -->
        <section>
            <form action="submit">

                <label for="regUserInput">
                    Username:
                    <input id="regUserInput" type="text">
                </label>

                <label for="regPassInput">
                    Password:
                    <input id="regPassInput" type="text">
                </label>

                <label for="regPassAgainInput">
                    Repeat password:
                    <input id="regPassAgainInput" type="text">
                </label>
                <button type="submit">Register user</button>
            </form>
        </section>
    </main>
    <!-- 
    html för två formulär
    * Ett för inloggning
    * Ett för registrering
    
    
    Start
    * Inloggningsformuläret syns först
    * Registreringen syns ej
    
    * Knapp för "Registrera dig"
    * Klickas denna så 
    * Inloggningsformuläret blir osynlig
    * Registretingsformuläret blir synlig
    
    
    Inloggningsformuläret består av
    * "Välkommen. Logga in för att komma vidare"
    * Fältet "username"
    * Fältet "password"
    * "Inte medlem? Registrera dig här"
    * Knappen "till registrering"
    
    
    Registreringsformuläret består av
    * Titel "Registrera ny användare"
    * Fältet "username"
    * Fältet "password"
    * Fältet "password again"
    * Checkbox "Jag godkänner villkoren"
    * Knappen "registrera användare"
    
    
    -->
</body>
</html>
