<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./script.js"></script>
    <title>Login</title>
</head>
<body>
    <main class="main-container">
        <h1 class="main-container__title">Welcome to the web!</h1>
        <p class="main-container__text">Please login to continue</p>
        <section id="loginSection" class="main-container__wrapper">

            <!-- Login form -->
            <form id="loginForm" class="main-container__flex" action="submit">
                
                <label class="main-container__inner-flex-label" for="loginUserInput">
                    Username:
                    <input id="loginUserInput" class="main-container__input-field" type="text" name="name">
                </label>
                
                <label class="main-container__inner-flex-label" for="loginPassInput">
                    Password:
                    <input id="loginPassInput" class="main-container__input-field" type="text" name="password">
                </label>
                <button class="main-container__btn" type="submit">Log in</button>
            </form>
            
            <section class="main-container__flex">
                <p class="main-container__sub-text">Not already a user?</p>
                <button id="loginRegisterBtn" class="main-container__btn">Register new user</button>
            </section>
        </section>

        <!-- Register form -->
        <section id="registerSection" class="main-container__wrapper main-container__wrapper--display-none">
            <form id="registerForm" class="main-container__flex" action="submit">

                <label class="main-container__inner-flex-label" for="registerUserInput">
                    Username:
                    <input id="registerUserInput" class="main-container__input-field" type="text">
                </label>

                <label class="main-container__inner-flex-label" for="registerPassInput">
                    Password:
                    <input id="registerPassInput" class="main-container__input-field" type="text">
                </label>

                <label class="main-container__inner-flex-label" for="registerPassAgainInput">
                    Repeat password:
                    <input id="registerPassAgainInput" class="main-container__input-field" type="text">
                </label>
                <button class="main-container__btn" type="submit">Register user</button>
            </form>
        </section>
    </main>
    <!-- 
    html för två formulär
    * Ett för inloggning
    * Ett för registrering
    
    
    Start
    * Inloggningsformuläret syns först
    * Registreringen syns ej
    
    * Knapp för "Registrera dig"
    * Klickas denna så 
    * Inloggningsformuläret blir osynlig
    * Registretingsformuläret blir synlig
    
    
    Inloggningsformuläret består av
    * "Välkommen. Logga in för att komma vidare"
    * Fältet "username"
    * Fältet "password"
    * "Inte medlem? Registrera dig här"
    * Knappen "till registrering"
    
    
    Registreringsformuläret består av
    * Titel "Registrera ny användare"
    * Fältet "username"
    * Fältet "password"
    * Fältet "password again"
    * Checkbox "Jag godkänner villkoren"
    * Knappen "registrera användare"
    
    
    -->
</body>
</html>
