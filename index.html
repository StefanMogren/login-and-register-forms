<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./script.js"></script>
    <title>Login</title>
</head>
<body>
    <!-- 
    html för två formulär
    * Ett för inloggning
    * Ett för registrering


    Start
    * Inloggningsformuläret syns först
    * Registreringen syns ej

    * Knapp för "Registrera dig"
    * Klickas denna så 
        * Inloggningsformuläret blir osynlig
        * Registretingsformuläret blir synlig


    Inloggningsformuläret består av
    * "Välkommen. Logga in för att komma vidare"
    * Fältet "username"
    * Fältet "password"
    * "Inte medlem? Registrera dig här"
    * Knappen "till registrering"


    Registreringsformuläret består av
    * Titel "Registrera ny användare"
    * Fältet "username"
    * Fältet "password"
    * Fältet "password again"
    * Checkbox "Jag godkänner villkoren"
    * Knappen "registrera användare"


    -->
    <h1>Login</h1>
</body>
</html>
